name: TLOGAnalyzerIOS
options:
  bundleIdPrefix: ua.tloganalyzer
  deploymentTarget:
    iOS: "16.0"
targets:
  TLOGAnalyzerIOS:
    type: application
    platform: iOS
    sources:
      - path: TLOGAnalyzerIOS
    resources:
      - path: Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.tloganalyzer.ios
        PRODUCT_NAME: TLOG Analyzer
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: TLOG Analyzer
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
