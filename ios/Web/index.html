<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TLOG Analyzer iOS</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;background:#0a0d11;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{padding:20px}
    .card{background:#121820;border:1px solid #1e293b;border-radius:12px;padding:18px;margin-bottom:14px}
    .muted{color:#94a3b8}.ok{color:#22c55e}.warn{color:#f59e0b}
    progress{width:100%;height:8px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h2>TLOG Analyzer — iOS Offline</h2>
    <div id="status" class="muted">Очікую .tlog з iOS Files…</div>
  </div>
  <div class="card">
    <div><b>Файл:</b> <span id="name">—</span></div>
    <div><b>Розмір:</b> <span id="size">—</span></div>
  </div>
  <div class="card">
    <b>Офлайн engine</b>
    <p id="engine" class="warn">Підготовлено міст Swift → Web. Повний MAVLink/TLOG engine переноситься з Python окремими модулями.</p>
  </div>
</main>
<script src="offline-core.js"></script>
</body>
</html>
