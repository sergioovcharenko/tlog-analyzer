name: Android Offline APK

on:
  pull_request:
    paths:
      - 'android-offline/**'
      - '.github/workflows/android-offline-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'android-offline/**'
      - '.github/workflows/android-offline-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build offline APK
        working-directory: android-offline
        run: gradle --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TLOG-Analyzer-Offline-APK
          path: android-offline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
