name: Video TLOG analysis CI

on:
  push:
    branches: [feature/video-tlog-analysis, feature/flight-time-auto-sync]
    paths:
      - 'backend/main.py'
      - 'backend/video_analysis.py'
      - 'backend/requirements.txt'
      - 'index.html'
      - 'tests/test_video_analysis_core.py'
      - 'tests/test_video_analysis_api.py'
      - 'tests/test_video_analysis_frontend.py'
      - 'tests/test_flight_time_auto_sync.py'
      - '.github/workflows/video-tlog-analysis.yml'
  pull_request:
    paths:
      - 'backend/main.py'
      - 'backend/video_analysis.py'
      - 'backend/requirements.txt'
      - 'index.html'
      - 'tests/test_video_analysis_core.py'
      - 'tests/test_video_analysis_api.py'
      - 'tests/test_video_analysis_frontend.py'
      - 'tests/test_flight_time_auto_sync.py'
      - '.github/workflows/video-tlog-analysis.yml'

jobs:
  video-tlog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Verify packaged FFmpeg
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          import subprocess
          exe = imageio_ffmpeg.get_ffmpeg_exe()
          print(exe)
          subprocess.run([exe, '-version'], check=True)
          PY

      - name: Run video TLOG tests
        run: |
          python -m pytest \
            tests/test_video_analysis_core.py \
            tests/test_video_analysis_api.py \
            tests/test_video_analysis_frontend.py \
            tests/test_flight_time_auto_sync.py \
            -v

      - name: Run high-value existing regressions
        run: |
          python -m pytest \
            tests/test_report_export.py \
            tests/test_report_export_full.py \
            tests/test_report_export_runtime_vtx.py \
            tests/test_ai_reconstruction.py \
            tests/test_ai_reconstruction_frontend_contract.py \
            tests/test_ai_reconstruction_integration.py \
            tests/test_vtx_frequency_matrix.py \
            tests/test_board_messages_complete_list.py \
            tests/test_graph_board_statustext_clickable.py \
            tests/test_statustext_severity_passthrough.py \
            tests/test_map_default_flight.py \
            tests/test_frontend_flow.py \
            -v

      - name: Python syntax check
        run: python -m py_compile backend/main.py backend/video_analysis.py

      - name: Embedded JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.rfind('<script>')
          b = s.find('</script>', a)
          if a < 0 or b < 0:
              raise SystemExit('embedded script not found')
          Path('/tmp/tlog-analyzer-app.js').write_text(s[a+8:b], encoding='utf-8')
          PY
          node --check /tmp/tlog-analyzer-app.js
