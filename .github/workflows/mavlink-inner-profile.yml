name: MAVLink inner profile

on:
  push:
    branches:
      - feature/mavlink-inner-profile
    paths:
      - backend/main.py
      - tests/test_mavlink_inner_profile_contract.py
      - tools/apply_mavlink_inner_profile.py
      - .github/workflows/mavlink-inner-profile.yml
  pull_request:
    paths:
      - backend/main.py
      - tests/test_mavlink_inner_profile_contract.py
      - tools/apply_mavlink_inner_profile.py
      - .github/workflows/mavlink-inner-profile.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply MAVLink inner profile
        run: python tools/apply_mavlink_inner_profile.py
      - name: Run inner profile contract
        run: python -m unittest tests.test_mavlink_inner_profile_contract -v
      - name: Compile backend
        run: python -m py_compile backend/main.py
      - name: Commit generated inner profile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- backend/main.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git commit -m "feat: expose MAVLink inner profile"
          git push
