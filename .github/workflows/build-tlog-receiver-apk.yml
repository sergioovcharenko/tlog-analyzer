name: Build TLOG Receiver APK

on:
  push:
    branches:
      - build/tlog-receiver-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: tlog-receiver
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOG-Receiver-APK
          path: tlog-receiver/app/build/outputs/apk/debug/app-debug.apk
