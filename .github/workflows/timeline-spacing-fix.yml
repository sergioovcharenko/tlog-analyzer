name: Timeline spacing fix

on:
  push:
    branches:
      - fix/timeline-altitude-distance-spacing
    paths:
      - index.html
      - tests/test_timeline_spacing_contract.py
      - tools/apply_timeline_spacing_fix.py
      - .github/workflows/timeline-spacing-fix.yml
  pull_request:
    paths:
      - index.html
      - tests/test_timeline_spacing_contract.py
      - tools/apply_timeline_spacing_fix.py
      - .github/workflows/timeline-spacing-fix.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply timeline spacing fix
        run: python tools/apply_timeline_spacing_fix.py
      - name: Run timeline spacing contract
        run: python -m unittest tests.test_timeline_spacing_contract -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/tlog-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tlog-inline.js
      - name: Commit generated fix
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated spacing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: separate timeline altitude and distance values"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
