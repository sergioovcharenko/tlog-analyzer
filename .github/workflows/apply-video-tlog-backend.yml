name: Apply video TLOG backend

on:
  push:
    branches: [feature/video-tlog-analysis, feature/flight-time-auto-sync]
    paths:
      - '.github/workflows/apply-video-tlog-backend.yml'
      - 'tools/apply_video_tlog_backend.py'
      - 'tests/test_video_analysis_api.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Apply video backend patch
        run: python tools/apply_video_tlog_backend.py

      - name: Run video backend tests
        run: python -m pytest tests/test_video_analysis_core.py tests/test_video_analysis_api.py tests/test_flight_time_auto_sync.py -v

      - name: Python syntax check
        run: python -m py_compile backend/main.py backend/video_analysis.py

      - name: Commit patched backend
        run: |
          if git diff --quiet -- backend/main.py; then
            echo 'No backend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          git commit -m 'feat: expose Flight Time auto-sync in video API'
          git push
