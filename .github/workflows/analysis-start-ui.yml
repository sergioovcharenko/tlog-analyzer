name: Analysis start UI cleanup

# Final verification runs against the committed branch contents.
on:
  push:
    branches: [fix/remove-analysis-overlay-and-simplify-title]
    paths:
      - 'index.html'
      - 'tests/test_analysis_start_ui.py'
      - 'tools/apply_analysis_start_ui_cleanup.py'
      - '.github/workflows/analysis-start-ui.yml'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply analysis start UI cleanup
        run: python tools/apply_analysis_start_ui_cleanup.py
      - name: Run analysis start UI contract
        run: python -m unittest tests.test_analysis_start_ui -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit cleaned UI
        run: |
          if git diff --quiet -- index.html; then
            echo 'No analysis start UI changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove analysis overlay and simplify title'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
