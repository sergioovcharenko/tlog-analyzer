name: Apply EFI engine load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-engine-load-efi.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply EFI Engine Load patch
        run: python tools/apply_engine_load_efi.py
      - name: Run engine load contract
        run: python -m unittest tests.test_engine_load_contract -v
      - name: Run TX16 UI contract
        run: python -m unittest tests.test_tx16_ui_contract -v
      - name: Run timeline runtime regression
        run: python -m unittest tests.test_timeline_scope_runtime -v
      - name: Check backend syntax
        run: python -m py_compile backend/main.py
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          if a < 0 or b < 0:
              raise SystemExit('embedded script not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit production changes
        run: |
          if git diff --quiet -- backend/main.py index.html; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py index.html
          git commit -m 'fix: use EFI_STATUS engine load in timeline'
          git push
