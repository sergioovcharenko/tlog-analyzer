name: TX16 RF highlight contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_tx16_ui_contract.py'
      - '.github/workflows/tx16-rf-highlight-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run TX16 UI contract tests
        run: python -m unittest tests.test_tx16_ui_contract -v
