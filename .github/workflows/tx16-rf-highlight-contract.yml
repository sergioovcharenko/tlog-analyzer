name: TX16 RF highlight contract

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_tx16_ui_contract.py'
      - 'tools/apply_tx16_rf_highlight.py'
      - '.github/workflows/tx16-rf-highlight-contract.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SA/SB RF highlight patch
        run: python tools/apply_tx16_rf_highlight.py

      - name: Run TX16 UI contract tests
        run: python -m unittest tests.test_tx16_ui_contract -v

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          if a < 0 or b < 0:
              raise SystemExit('embedded script not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: highlight SA and SB in blue'
          git push

# red-check: large SA/SB cards must be blue and SB must show MHz
