name: Attitude dBm live regression

on:
  push:
    branches:
      - fix/attitude-dbm-color-live
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed source recolors live dBm
        run: python -m unittest tests/test_attitude_dbm_colors.py -v
