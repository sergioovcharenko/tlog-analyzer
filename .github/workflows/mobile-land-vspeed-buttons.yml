name: Mobile LAND speed and floating buttons

on:
  push:
    branches:
      - fix/mobile-land-vspeed-buttons
    paths:
      - index.html
      - tests/test_mobile_land_vspeed_buttons.py
      - .github/workflows/mobile-land-vspeed-buttons.yml
  pull_request:
    paths:
      - index.html
      - tests/test_mobile_land_vspeed_buttons.py
      - .github/workflows/mobile-land-vspeed-buttons.yml

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mobile layout contract
        run: python -m unittest tests.test_mobile_land_vspeed_buttons -v
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              p=Path(f'/tmp/mobile-layout-{i}.js')
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
