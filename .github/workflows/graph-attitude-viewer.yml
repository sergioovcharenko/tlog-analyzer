name: Graph attitude viewer

on:
  push:
    branches: [graph-attitude-work]
    paths:
      - 'tools/apply_graph_attitude_viewer.py'
      - 'tests/test_graph_data_contract.py'
      - 'tests/test_graph_viewer_ui_contract.py'
      - '.github/workflows/graph-attitude-viewer.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply graph and attitude viewer patch
        run: python tools/apply_graph_attitude_viewer.py

      - name: Check backend syntax
        run: python -m py_compile backend/main.py

      - name: Run graph data contract
        run: python -m unittest tests.test_graph_data_contract -v

      - name: Run graph viewer UI contract
        run: python -m unittest tests.test_graph_viewer_ui_contract -v

      - name: Run relevant regression contracts
        run: |
          python -m unittest \
            tests.test_backend_tx16_mapping \
            tests.test_engine_load_contract \
            tests.test_esc_fault_ui_contract \
            tests.test_repeat_alert_ui \
            tests.test_timeline_scope_runtime \
            tests.test_tx16_ui_contract -v

      - name: Check every inline JavaScript block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if not blocks:
              raise SystemExit('inline scripts not found')
          for i,block in enumerate(blocks):
              Path(f'/tmp/app-{i}.js').write_text(block,encoding='utf-8')
          print(f'inline script blocks: {len(blocks)}')
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done

      - name: Commit patched application
        run: |
          if git diff --quiet -- backend/main.py index.html; then
            echo 'No application changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py index.html
          git commit -m 'feat: add telemetry graph and attitude viewer'
          git push
