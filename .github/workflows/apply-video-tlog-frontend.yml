name: Apply video TLOG frontend

on:
  push:
    branches: [feature/video-tlog-analysis]
    paths:
      - 'tools/apply_video_tlog_frontend.py'
      - 'tests/test_video_analysis_frontend.py'
      - '.github/workflows/apply-video-tlog-frontend.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Apply video frontend patch
        run: python tools/apply_video_tlog_frontend.py
      - name: Run frontend contract tests
        run: python -m pytest tests/test_video_analysis_frontend.py -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          if a < 0 or b < 0:
              raise SystemExit('embedded script not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add optional video upload flow'
          git push
