name: Radio summary cleanup

on:
  push:
    branches:
      - feature/radio-summary-cleanup
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply radio summary cleanup
        run: python tools/apply_radio_summary_cleanup.py
      - name: Run radio summary cleanup contract
        run: python -m unittest tests/test_radio_summary_cleanup.py -v
      - name: Compile backend
        run: python -m py_compile backend/main.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts))
              path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit generated integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- backend/main.py index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py index.html
          git commit -m "ui: show min RSSI and dBm worst/average"
          git pull --rebase origin feature/radio-summary-cleanup
          git push
