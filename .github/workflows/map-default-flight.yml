name: Map default flight

on:
  push:
    branches:
      - fix/map-default-main-flight
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply map default flight fix
        run: python tools/apply_default_flight_selection.py
      - name: Run map default flight regression
        run: python -m unittest tests/test_map_default_flight.py -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          code='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(code); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit generated map fix
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: show substantial flight on map by default'
          git push
