name: Attitude dashboard v2.2

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'backend/main.py'
      - 'tests/test_attitude_dashboard_v22_contract.py'
      - '.github/workflows/attitude-dashboard-v22.yml'
      - 'tools/apply_attitude_dashboard_v22.py'

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply attitude dashboard v2.2
        run: python tools/apply_attitude_dashboard_v22.py
      - name: Run attitude dashboard v2.2 contract
        run: python -m unittest tests.test_attitude_dashboard_v22_contract -v
      - name: Check backend syntax
        run: python -m py_compile backend/main.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
              if not b.strip():
                  continue
              p=Path(f'/tmp/v22-{i}.js')
              p.write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit patched dashboard
        run: |
          if git diff --quiet -- index.html backend/main.py; then
            echo "No dashboard patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/main.py
          git commit -m "feat: upgrade attitude dashboard to v2.2"
          git push origin HEAD:main
