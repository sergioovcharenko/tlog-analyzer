name: MAVLink speed optimization

on:
  push:
    branches:
      - feature/mavlink-speed-optimization
    paths:
      - backend/main.py
      - tests/test_mavlink_recv_fast_path_contract.py
      - tools/apply_mavlink_speed_optimization.py
      - .github/workflows/mavlink-speed-optimization.yml
  pull_request:
    paths:
      - backend/main.py
      - tests/test_mavlink_recv_fast_path_contract.py
      - tools/apply_mavlink_speed_optimization.py
      - .github/workflows/mavlink-speed-optimization.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply MAVLink recv fast path
        run: python tools/apply_mavlink_speed_optimization.py
      - name: Run MAVLink recv fast-path contract
        run: python -m unittest tests.test_mavlink_recv_fast_path_contract -v
      - name: Compile backend
        run: python -m py_compile backend/main.py
      - name: Commit generated fast path
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- backend/main.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git commit -m "perf: use direct MAVLink recv fast path"
          git push
