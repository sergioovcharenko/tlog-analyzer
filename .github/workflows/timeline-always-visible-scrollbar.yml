name: Timeline always visible scrollbar

on:
  push:
    branches: [fix/timeline-always-visible-scrollbar, main]
    paths:
      - index.html
      - tools/apply_timeline_always_visible_scrollbar.py
      - tests/test_timeline_always_visible_scrollbar.py
      - .github/workflows/timeline-always-visible-scrollbar.yml
  pull_request:
    paths:
      - index.html
      - tools/apply_timeline_always_visible_scrollbar.py
      - tests/test_timeline_always_visible_scrollbar.py
      - .github/workflows/timeline-always-visible-scrollbar.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scrollbar patch
        if: github.event_name == 'push' && github.ref_name == 'fix/timeline-always-visible-scrollbar'
        run: python tools/apply_timeline_always_visible_scrollbar.py
      - name: Commit generated frontend
        if: github.event_name == 'push' && github.ref_name == 'fix/timeline-always-visible-scrollbar'
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: keep timeline scrollbar visible while browsing'
          git push
      - run: python -m unittest tests.test_timeline_always_visible_scrollbar -v
      - run: python -m unittest tests.test_tx16_ui_contract -v
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts)); path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
