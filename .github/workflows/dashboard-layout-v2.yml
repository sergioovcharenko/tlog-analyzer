name: Dashboard layout v2

on:
  push:
    branches: [feature/dashboard-layout-v2, fix/global-theme-graph-visibility, fix/restore-dashboard-v2-move-summary, main]
    paths:
      - index.html
      - tools/apply_dashboard_layout_v2.py
      - tools/apply_global_theme_fix.py
      - tools/apply_horizon_only_dark_layout.py
      - tests/test_dashboard_layout_v2_contract.py
      - .github/workflows/dashboard-layout-v2.yml
  pull_request:
    paths:
      - index.html
      - tools/apply_dashboard_layout_v2.py
      - tools/apply_global_theme_fix.py
      - tools/apply_horizon_only_dark_layout.py
      - tests/test_dashboard_layout_v2_contract.py
      - .github/workflows/dashboard-layout-v2.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply dashboard patch on feature branch
        if: github.event_name == 'push' && github.ref_name == 'feature/dashboard-layout-v2'
        run: python tools/apply_dashboard_layout_v2.py
      - name: Apply global theme visibility fix
        if: github.event_name == 'push' && github.ref_name == 'fix/global-theme-graph-visibility'
        run: python tools/apply_global_theme_fix.py
      - name: Apply targeted dashboard restore
        if: github.event_name == 'push' && github.ref_name == 'fix/restore-dashboard-v2-move-summary'
        run: python tools/apply_horizon_only_dark_layout.py
      - name: Commit generated dashboard
        if: github.event_name == 'push' && (github.ref_name == 'feature/dashboard-layout-v2' || github.ref_name == 'fix/global-theme-graph-visibility' || github.ref_name == 'fix/restore-dashboard-v2-move-summary')
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            if [ "${GITHUB_REF_NAME}" = "fix/global-theme-graph-visibility" ]; then
              git commit -m "fix: show theme switch on upload page"
            elif [ "${GITHUB_REF_NAME}" = "fix/restore-dashboard-v2-move-summary" ]; then
              git commit -m "fix: restore dashboard v2 and keep summary under horizon"
            else
              git commit -m "feat: apply dashboard layout v2"
            fi
            git push
          fi
      - run: python -m unittest tests.test_dashboard_layout_v2_contract -v
      - run: python -m unittest tests.test_dynamic_mavlink_plot_ui -v
      - run: python -m unittest tests.test_attitude_dashboard_v22_contract -v
      - run: python -m unittest tests.test_tx16_ui_contract -v
      - run: python -m unittest tests.test_frontend_flow -v
      - name: Inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write('\n'.join(scripts))
              path = f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Verify targeted restore patcher idempotency
        if: github.event_name == 'push' && github.ref_name == 'fix/restore-dashboard-v2-move-summary'
        run: |
          before=$(sha256sum index.html | cut -d' ' -f1)
          python tools/apply_horizon_only_dark_layout.py
          after=$(sha256sum index.html | cut -d' ' -f1)
          test "$before" = "$after"
