name: AI conclusion rules v2

on:
  push:
    branches:
      - feature/ai-conclusion-rules-v2
    paths:
      - backend/ai_reconstruction.py
      - tests/test_ai_reconstruction.py
      - .github/workflows/ai-conclusion-rules-v2.yml
  pull_request:
    paths:
      - backend/ai_reconstruction.py
      - tests/test_ai_reconstruction.py
      - .github/workflows/ai-conclusion-rules-v2.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run AI reconstruction unit tests
        run: python -m unittest tests.test_ai_reconstruction -v
      - name: Compile AI reconstruction
        run: python -m py_compile backend/ai_reconstruction.py
