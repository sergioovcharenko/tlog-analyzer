name: Report export

on:
  push:
    branches:
      - feature/report-export
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply report export implementation
        run: python tools/apply_report_export.py
      - name: Run report export contracts
        run: |
          python -m unittest tests/test_report_export.py -v
          python -m unittest tests/test_report_export_full.py -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts)); path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit generated report export
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: implement report export"
          git push
