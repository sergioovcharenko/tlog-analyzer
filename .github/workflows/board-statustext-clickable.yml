name: Board STATUSTEXT clickable

on:
  push:
    branches:
      - feature/board-statustext-clickable
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply board STATUSTEXT integration
        run: python tools/apply_board_statustext_clickable.py
      - name: Run board STATUSTEXT contract
        run: python -m unittest tests/test_graph_board_statustext_clickable.py -v
      - name: Run existing board message tests
        run: python -m unittest tests/test_dynamic_mavlink_plot_backend.py tests/test_board_messages_complete_list.py -v
      - name: Check Python syntax
        run: python -m py_compile backend/mavlink_plot.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts))
              path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit generated integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: make board messages clickable and classify EKF warnings"
          git pull --rebase origin feature/board-statustext-clickable
          git push
