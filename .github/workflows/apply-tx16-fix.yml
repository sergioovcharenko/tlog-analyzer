name: Apply TX16 control mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tx16-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply TX16 UI patch
        run: python tools/apply_tx16_fix.py

      - name: Run TX16 contract tests
        run: python -m pytest -q tests/test_tx16_ui_contract.py

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: map TX16 controls and analyze emergency stop'
          git push
