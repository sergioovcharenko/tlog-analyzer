name: User-facing naming

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_user_facing_naming.py'
      - 'tools/apply_user_facing_naming.py'
      - '.github/workflows/user-facing-naming.yml'

permissions:
  contents: write

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply user-facing naming
        run: python tools/apply_user_facing_naming.py
      - name: Run user-facing naming tests
        run: python -m unittest tests.test_user_facing_naming
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already uses the requested naming"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: remove AI branding from visible product copy"
          git push
