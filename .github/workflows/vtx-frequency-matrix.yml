name: VTX frequency matrix

on:
  push:
    branches:
      - feature/vtx-frequency-matrix
      - fix/vtx-dbm-all-samples-v2
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply VTX matrix integration
        run: python tools/apply_vtx_frequency_matrix.py
      - name: Run VTX matrix contract
        run: python -m unittest tests/test_vtx_frequency_matrix.py -v
      - name: Check backend syntax
        run: python -m py_compile backend/main.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts)); path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit generated VTX matrix
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html backend/main.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/main.py
          git commit -m "fix: render VTX averages from all dBm samples"
          git push
