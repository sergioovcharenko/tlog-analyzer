name: Apply video TLOG results

on:
  push:
    branches: [feature/video-tlog-analysis]
    paths:
      - 'tools/apply_video_tlog_results.py'
      - '.github/workflows/apply-video-tlog-results.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Apply results patch
        run: python tools/apply_video_tlog_results.py
      - name: Run frontend tests
        run: python -m pytest tests/test_video_analysis_frontend.py -v
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>'); b=s.find('</script>',a)
          if a < 0 or b < 0: raise SystemExit('embedded script not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit result UI
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: render combined video and tlog results'
          git push
