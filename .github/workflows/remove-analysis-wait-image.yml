name: Remove analysis wait image

on:
  push:
    branches: [fix/remove-analysis-wait-image]
    paths:
      - 'index.html'
      - 'tests/test_analysis_wait_overlay.py'
      - 'tools/apply_remove_analysis_wait_image.py'
      - '.github/workflows/remove-analysis-wait-image.yml'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply text-only wait overlay patch
        run: python tools/apply_remove_analysis_wait_image.py
      - name: Run wait overlay contract
        run: python -m unittest tests.test_analysis_wait_overlay -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched overlay
        run: |
          if git diff --quiet -- index.html; then
            echo 'No overlay changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove analysis wait image'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
