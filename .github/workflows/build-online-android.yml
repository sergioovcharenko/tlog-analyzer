name: Build Online TLOG Analyzer APK

on:
  push:
    branches:
      - online/tlog-analyzer-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-online
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-online/app/build/outputs/apk/debug/app-debug.apk TLOG-Analyzer-Online.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOG-Analyzer-Online-APK
          path: TLOG-Analyzer-Online.apk
          retention-days: 30
