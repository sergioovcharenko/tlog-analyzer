name: ESC alert bold contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/esc-alert-bold.yml'
      - 'tools/apply_esc_alert_bold.py'
      - 'tests/test_esc_alert_bold.py'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ESC alert bold patch
        run: python tools/apply_esc_alert_bold.py
      - name: Run ESC bold contract
        run: python -m unittest tests/test_esc_alert_bold.py -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo 'No frontend changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: make persistent ESC fault conclusion bold'
          git push
