name: Timeline spacing v2

on:
  push:
    branches:
      - main
    paths:
      - tools/apply_timeline_spacing_fix_v2.py
      - tests/test_timeline_altitude_width_contract.py
      - .github/workflows/timeline-spacing-v2.yml
      - index.html

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply timeline spacing v2
        run: python tools/apply_timeline_spacing_fix_v2.py
      - name: Run timeline altitude width contract
        run: python -m unittest tests.test_timeline_altitude_width_contract -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/tlog-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tlog-inline.js
      - name: Commit generated fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: prevent LAND altitude and distance overlap"
          git pull --rebase origin main
          git push origin HEAD:main
