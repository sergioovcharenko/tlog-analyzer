name: Video TLOG frontend contract

on:
  push:
    branches: [feature/video-tlog-analysis]
    paths:
      - 'index.html'
      - 'tests/test_video_analysis_frontend.py'
      - '.github/workflows/video-tlog-frontend-contract.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_video_analysis_frontend.py'
      - '.github/workflows/video-tlog-frontend-contract.yml'

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run frontend video contract
        run: python -m pytest tests/test_video_analysis_frontend.py -v
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>')
          b=s.find('</script>',a)
          if a < 0 or b < 0:
              raise SystemExit('embedded script not found')
          Path('/tmp/app.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
