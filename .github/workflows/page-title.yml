name: Clean page title

on:
  push:
    branches:
      - fix/clean-page-title
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test browser title
        run: python -m unittest tests/test_page_title.py -v
