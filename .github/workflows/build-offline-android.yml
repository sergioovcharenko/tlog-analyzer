name: Build Offline TLOG Analyzer APK

on:
  push:
    branches:
      - offline/tlog-analyzer-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle current offline analyzer into Android project
        run: |
          mkdir -p android-offline/app/src/main/python
          curl -fsSL https://raw.githubusercontent.com/sergioovcharenko/tlog-analyzer/main/offline/main.py -o android-offline/app/src/main/python/main.py
          curl -fsSL https://raw.githubusercontent.com/sergioovcharenko/tlog-analyzer/main/offline/index.html -o android-offline/app/src/main/python/index.html
          test -s android-offline/app/src/main/python/main.py
          test -s android-offline/app/src/main/python/index.html

      - name: Build debug APK
        working-directory: android-offline
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android-offline/app/build/outputs/apk/debug/app-debug.apk TLOG-Analyzer-Offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TLOG-Analyzer-Offline-APK
          path: TLOG-Analyzer-Offline.apk
          retention-days: 30
