name: Expert summary spacing

on:
  push:
    branches: [feature/expert-summary-section-spacing]
    paths:
      - '.github/workflows/expert-summary-spacing.yml'
      - 'backend/ai_expert.py'
      - 'index.html'
      - 'tests/test_expert_summary_spacing.py'
      - 'tests/test_ai_expert_integration.py'
      - 'tools/apply_expert_summary_spacing.py'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply summary spacing patch
        run: python tools/apply_expert_summary_spacing.py
      - name: Run expert summary spacing contract
        run: python -m unittest tests.test_expert_summary_spacing -v
      - name: Run AI expert regression tests
        run: python -m unittest discover -s tests -p 'test_ai_expert*.py' -v
      - name: Compile Python
        run: python -m py_compile backend/ai_expert.py backend/ai_expert_modules.py backend/ai_expert_sessions.py
      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patched summary layout
        run: |
          if git diff --quiet -- backend/ai_expert.py index.html; then
            echo 'No summary layout changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/ai_expert.py index.html
          git commit -m 'ui: separate propulsion and LOITER summary paragraphs'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
