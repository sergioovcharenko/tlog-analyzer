name: UI cleanup timeline

on:
  push:
    branches:
      - feature/ui-cleanup-timeline
    paths:
      - index.html
      - tests/test_ui_cleanup_contract.py
      - tools/apply_ui_cleanup.py
      - .github/workflows/ui-cleanup-timeline.yml
  pull_request:
    paths:
      - index.html
      - tests/test_ui_cleanup_contract.py
      - tools/apply_ui_cleanup.py
      - .github/workflows/ui-cleanup-timeline.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run UI cleanup contract
        run: python -m unittest tests.test_ui_cleanup_contract -v
