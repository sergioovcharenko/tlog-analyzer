name: UI cleanup timeline

on:
  push:
    branches:
      - feature/ui-cleanup-timeline
    paths:
      - index.html
      - tests/test_ui_cleanup_contract.py
      - tools/apply_ui_cleanup.py
      - .github/workflows/ui-cleanup-timeline.yml
  pull_request:
    paths:
      - index.html
      - tests/test_ui_cleanup_contract.py
      - tools/apply_ui_cleanup.py
      - .github/workflows/ui-cleanup-timeline.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply UI cleanup
        run: python tools/apply_ui_cleanup.py
      - name: Run UI cleanup contract
        run: python -m unittest tests.test_ui_cleanup_contract -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          joined='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(joined)
              path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit generated UI integration
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: clean alerts and stack LAND vertical speed"
          git pull --rebase origin feature/ui-cleanup-timeline
          git push
