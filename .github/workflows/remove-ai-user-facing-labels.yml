name: Remove user-facing AI labels

on:
  push:
    branches:
      - feature/remove-ai-user-facing-labels
    paths:
      - index.html
      - backend/main.py
      - tools/remove_user_facing_ai_labels.py
      - tools/apply_ai_reconstruction.py
      - tools/apply_ai_expert.py
      - tests/test_user_facing_ai_labels.py
      - .github/workflows/remove-ai-user-facing-labels.yml
  pull_request:
    paths:
      - index.html
      - backend/main.py
      - tools/remove_user_facing_ai_labels.py
      - tools/apply_ai_reconstruction.py
      - tools/apply_ai_expert.py
      - tests/test_user_facing_ai_labels.py
      - .github/workflows/remove-ai-user-facing-labels.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply user-facing terminology
        run: python tools/remove_user_facing_ai_labels.py
      - name: Verify user-facing labels
        run: python -m unittest tests.test_user_facing_ai_labels -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/tlog-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tlog-inline.js
      - name: Commit generated terminology changes
        if: github.event_name == 'push' && github.ref_name == 'feature/remove-ai-user-facing-labels'
        run: |
          if git diff --quiet -- index.html backend/main.py tools/apply_ai_reconstruction.py tools/apply_ai_expert.py; then
            echo "No generated terminology changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend/main.py tools/apply_ai_reconstruction.py tools/apply_ai_expert.py
          git commit -m "ui: remove AI wording from user-facing surfaces"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
