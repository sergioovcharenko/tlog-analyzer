plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tloganalyzer.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tloganalyzer.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install '../fastcrc_stub'
            install 'fastapi==0.115.8'
            install 'uvicorn==0.34.0'
            install 'python-multipart==0.0.20'
            install 'pymavlink==2.4.49'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
