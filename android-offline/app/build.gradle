plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ua.tloganalyzer.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.tloganalyzer.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-offline'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "fastapi==0.103.2"
            install "pydantic==1.10.13"
            install "uvicorn==0.23.2"
            install "python-multipart==0.0.6"
            install "pymavlink==2.4.41"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
